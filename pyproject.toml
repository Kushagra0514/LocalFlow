[project]
name = "localflow"
version = "0.2.0"
description = "Local-first push-to-talk dictation with optional cloud features for Windows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "keyboard>=0.13.5",
    "numpy>=2.5.2",
    "sounddevice>=0.5.6",
    "pyperclip>=1.8.2",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
]
